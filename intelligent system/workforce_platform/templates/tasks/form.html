<!DOCTYPE html>
<html>
<head>
    <title>{{ action }} Task</title>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul class="flashes">
      {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<h1>{{ action }} Task</h1>
<form method="POST">
    <label>Title: <input type="text" name="title" value="{{ task.title if task else '' }}"></label><br>
    <label>Description: <textarea name="description">{{ task.description if task else '' }}</textarea></label><br>
    <label>Start Date: <input type="date" name="start_date" value="{{ task.start_date if task else '' }}"></label><br>
    <label>Due Date: <input type="date" name="due_date" value="{{ task.due_date if task else '' }}"></label><br>
    <label>Priority:
        <select name="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
        </select>
    </label><br>
    <label>Required Skills:
        <select name="required_skills" multiple>
            {% for skill in skills %}
            <option value="{{ skill.id }}">{{ skill.name }}</option>
            {% endfor %}
        </select>
    </label><br>
    <button type="submit">{{ action }}</button>
</form>
</body>
</html>
